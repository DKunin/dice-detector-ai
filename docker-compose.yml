services:
  dice-detector-ai:
    build: .
    container_name: dice-detector-ai
    restart: unless-stopped
    init: true
    user: "0:0"
    env_file:
      - .env
    volumes:
      - /var/apps/photokun/data:/photokun-data
      - /var/apps/photokun/thumbnails:/photokun-thumbnails:ro
      - ./data:/data
